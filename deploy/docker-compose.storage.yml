services:
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    platform: linux/amd64
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ruizhibo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ruizhibo-storage-test}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    platform: linux/amd64
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ruizhibo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ruizhibo-storage-test}
      S3_BUCKET: ${S3_BUCKET:-ruizhibo-files}
    entrypoint: >-
      /bin/sh -c '
      until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done;
      mc mb --ignore-existing "local/$${S3_BUCKET}";
      mc anonymous set download "local/$${S3_BUCKET}";
      '

  api:
    environment:
      FILE_STORAGE_DRIVER: s3
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-ruizhibo-files}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-ruizhibo}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-ruizhibo-storage-test}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000/ruizhibo-files}
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      minio-init:
        condition: service_completed_successfully

volumes:
  minio_data:
